[package]
name = "folium"
version = "0.1.0"
description = "Folium - Alexandria's portable sister app: a sheet, nothing else"
authors = ["Marcelo Esposito"]
edition = "2021"
license = "MIT"

[lib]
# Il suffisso _lib evita il conflitto di nomi fra libreria ed eseguibile su Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "folium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# prove veloci dell'app vera (npm run folium:portable): niente LTO, compilazione incrementale
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2
