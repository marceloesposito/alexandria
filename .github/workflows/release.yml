name: Release

# Installer per Windows (.exe, .msi) e macOS (.dmg) allegati a una release in bozza.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Alexandria ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # versione portable (chiavetta USB): l'app con la cartella Alexandria-data accanto
      - name: portable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          node scripts/portable.mjs --mac src-tauri/target/universal-apple-darwin/release/bundle/macos/Alexandria.app --out dist-portable/Alexandria-portable
          cd dist-portable && ditto -c -k --sequesterRsrc --keepParent Alexandria-portable Alexandria-portable-macos.zip
      - name: portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/portable.mjs --win src-tauri/target/release/alexandria.exe --out dist-portable/Alexandria-portable
          Compress-Archive -Path dist-portable/Alexandria-portable -DestinationPath dist-portable/Alexandria-portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist-portable/*.zip
      - name: allega alla release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-portable/*.zip --clobber
